name: Daily Coding Bot Run

on:
  schedule:
    # Runs at 08:00 UTC every day. Adjust the cron time as needed for your timezone.
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for git pull --rebase to work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Adjust if you need a specific version
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Install Playwright Browsers
        run: playwright install chromium
        
      - name: Install Playwright System Dependencies
        run: playwright install-deps chromium
          
      - name: Run main.py
        env:
          # ── AI / Notifications (REQUIRED) ─────────────────────────────────────
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ── LeetCode (OPTIONAL — refresh cookies every few weeks) ──────────────
          # Log into leetcode.com → DevTools → Application → Cookies
          # Copy LEETCODE_SESSION and csrftoken values to GitHub secrets.
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          # ── Codeforces (REQUIRED — refresh CF_COOKIES_JSON when heatmap stops) ─
          # Run: python export_cf_cookies.py  to regenerate CF_COOKIES_JSON
          CODEFORCES_API_KEY: ${{ secrets.CODEFORCES_API_KEY }}
          CODEFORCES_API_SECRET: ${{ secrets.CODEFORCES_API_SECRET }}
          CODEFORCES_HANDLE: ${{ secrets.CODEFORCES_HANDLE }}
          CODEFORCES_PASSWORD: ${{ secrets.CODEFORCES_PASSWORD }}
          CF_COOKIES_JSON: ${{ secrets.CF_COOKIES_JSON }}
          # ── CodeChef (REQUIRED) ────────────────────────────────────────────────
          CODECHEF_USERNAME: ${{ secrets.CODECHEF_USERNAME }}
          CODECHEF_PASSWORD: ${{ secrets.CODECHEF_PASSWORD }}
          # ── HackerRank (REQUIRED) ──────────────────────────────────────────────
          HACKERRANK_USERNAME: ${{ secrets.HACKERRANK_USERNAME }}
          HACKERRANK_PASSWORD: ${{ secrets.HACKERRANK_PASSWORD }}
          DAILY_RUN_TIME: "08:00"
          SOLUTION_LANGUAGE: "cpp"
          LOG_LEVEL: "INFO"
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Varshitha Somashekar"
          git config --global user.email "varshithasomashekar22@gmail.com"
          git add solutions/
          # Only proceed if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit — skipping push."
          else
            git commit -m "chore: automate daily coding bot run [skip ci]"
            # Sync with remote before pushing (handles commits pushed during the run)
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi
